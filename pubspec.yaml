name: rumour
description: "Anonymous room-code chat app built with Flutter & Firebase."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0

  http: ^1.2.0
  shared_preferences: ^2.2.2
  uuid: ^4.5.0
  intl: ^0.19.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  flutter_animate: ^4.2.0
  pin_code_fields: ^8.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_logo.png

flutter_native_splash:
  color: "#0D0D0D"
  image: assets/icons/app_logo.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
