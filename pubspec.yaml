name: rumour
description: "Anonymous room-code chat app built with Flutter & Firebase."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0

  # Networking
  http: ^1.2.0

  # Local Storage (for identity + offline cache)
  shared_preferences: ^2.2.2

  # UUID for local user IDs
  uuid: ^4.5.0

  # Date formatting
  intl: ^0.19.0

  # State-management (simple, fast)
  provider: ^6.1.2

  # Cached images for avatar
  cached_network_image: ^3.3.1

  # Smooth animations (optional but good for bonus)
  flutter_animate: ^4.2.0

  # For pin-style room code input
  pin_code_fields: ^8.0.1

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/AppLogo.png
